name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # needed for release creation

jobs:
  # ── Restore + validate (always runs, no game files needed) ──────────────────
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore NuGet packages
        run: dotnet restore --configfile nuget.config

  # ── Full build (requires game files via DepotDownloader) ────────────────────
  build:
    runs-on: ubuntu-latest
    needs: restore
    # Requires STEAM_USERNAME and STEAM_PASSWORD repository secrets.
    # The account must own Lunacid (app ID 1745510).
    # Add them in Settings → Secrets and variables → Actions.
    if: |
      github.event_name != 'pull_request' ||
      (secrets.STEAM_USERNAME != '' && secrets.STEAM_PASSWORD != '')
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ── Download BepInEx core DLLs ─────────────────────────────────────────
      # The csproj prefers the NuGet BepInEx.Core package when BepInEx/core/
      # is absent; this step keeps the CI environment consistent with a real
      # game install.
      - name: Download BepInEx 5.4.23.2
        run: |
          curl -fsSL -o bepinex.zip \
            https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.2/BepInEx_win_x64_5.4.23.2.zip
          unzip -q bepinex.zip -d bepinex_tmp
          mkdir -p game/BepInEx/core
          cp -r bepinex_tmp/BepInEx/core/. game/BepInEx/core/

      # ── Download Lunacid managed DLLs via DepotDownloader ──────────────────
      - name: Install DepotDownloader
        run: dotnet tool install -g DepotDownloader

      - name: Download Lunacid managed DLLs
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        run: |
          ~/.dotnet/tools/DepotDownloader \
            -app 1745510 \
            -depot 1745511 \
            -username "$STEAM_USERNAME" \
            -password "$STEAM_PASSWORD" \
            -dir game \
            -filelist .github/managed-filelist.txt

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build Release
        run: dotnet build -c Release /p:GamePath="$(pwd)/game"

      # ── Upload DLL as workflow artifact ─────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunacidQoLMod
          path: bin/Release/netstandard2.1/LunacidQoLMod.dll
          if-no-files-found: error

  # ── Release (version tags only) ─────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: LunacidQoLMod
          path: release/

      - name: Package release zip
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p "staging/BepInEx/plugins"
          cp release/LunacidQoLMod.dll "staging/BepInEx/plugins/"
          cp README.md LICENSE "staging/"
          cd staging
          zip -r "../LunacidQoLMod-${TAG}.zip" .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "LunacidQoLMod-*.zip"
          generate_release_notes: true
